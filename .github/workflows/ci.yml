# CI: build and test on every push and pull request. A push to main also packs the package and publishes it to NuGet.
#
# The version comes from <Version> in Directory.Build.props. To release, change it and push to main:
# the package is published if that version is not on nuget.org yet, otherwise the publish step is skipped
# (so a push that does not bump the version only builds and tests).
#
# Publishing uses NuGet Trusted Publishing, no long-lived key is stored:
#   1. nuget.org -> your profile -> Trusted Publishing: add a policy
#      (Repository Owner = alt-stack-lite-dotnet, Repository = lite-union, Workflow File = ci.yml).
#   2. Repository secret NUGET_USER = the nuget.org profile name.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tests run on .NET 8, 9, 10 and 11; .NET 11 is a release candidate for now.
      - name: Install .NET SDKs (stable)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install .NET SDK (11, preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: "preview"

      - name: Restore
        run: dotnet restore Lite.Union.slnx

      - name: Build
        run: dotnet build Lite.Union.slnx -c Release --no-restore

      - name: Test (runtime tests, every target framework)
        run: dotnet test tests/Lite.Union.Test/Lite.Union.Test.csproj -c Release --no-build --verbosity normal

      - name: Test (generator tests)
        run: dotnet test tests/Lite.Union.GeneratorTest/Lite.Union.GeneratorTest.csproj -c Release --no-build --verbosity normal

  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # NuGet Trusted Publishing (OIDC)
    concurrency:
      group: nuget-publish
      cancel-in-progress: false   # a release that has started is not cut short by the next push
    steps:
      - uses: actions/checkout@v4

      # The package is built with a stable SDK: the generator targets netstandard2.0 and needs nothing newer.
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read the version
        id: version
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          if [ -z "$VERSION" ]; then echo "No <Version> in Directory.Build.props"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      # A published version cannot be replaced, so a push that does not change the version has nothing to publish.
      - name: Is this version already on nuget.org?
        id: exists
        run: |
          ID=lite.union
          VERSION=$(echo "${{ steps.version.outputs.VERSION }}" | tr 'A-Z' 'a-z')
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/$ID/$VERSION/$ID.$VERSION.nupkg")
          if [ "$CODE" = "200" ]; then
            echo "EXISTS=true" >> "$GITHUB_OUTPUT"
            echo "Lite.Union $VERSION is already published; nothing to do."
          else
            echo "EXISTS=false" >> "$GITHUB_OUTPUT"
            echo "Lite.Union $VERSION is new (nuget.org answered $CODE)."
          fi

      - name: Pack
        if: steps.exists.outputs.EXISTS == 'false'
        run: dotnet pack sources/Lite.Union/Lite.Union.csproj -c Release -o out

      - name: Check package contents
        if: steps.exists.outputs.EXISTS == 'false'
        run: |
          ls out
          unzip -l out/*.nupkg
          unzip -l out/*.nupkg | grep -q "analyzers/dotnet/cs/Lite.Union.dll"
          unzip -l out/*.nupkg | grep -q "README.md"
          test -f "out/Lite.Union.${{ steps.version.outputs.VERSION }}.nupkg"

      - name: Upload NuGet packages
        if: steps.exists.outputs.EXISTS == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: out/*.nupkg

      # Trusted Publishing: the GitHub OIDC token is exchanged for a one-hour nuget.org API key.
      - name: NuGet login (OIDC -> short-lived API key)
        if: steps.exists.outputs.EXISTS == 'false'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        if: steps.exists.outputs.EXISTS == 'false'
        run: |
          for f in out/*.nupkg; do
            dotnet nuget push "$f" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
