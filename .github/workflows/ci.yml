# CI: build and test on push/PR; pack and push to NuGet only for a v* tag that is on the release branch.
#
# To publish:
#   git tag v1.0.0-rc.1 && git push origin v1.0.0-rc.1
# The package is pushed only if the tagged commit is on the release branch.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

env:
  RELEASE_BRANCH: release

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tests run on .NET 8, 9, 10 and 11; .NET 11 is a release candidate for now.
      - name: Install .NET SDKs (stable)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install .NET SDK (11, preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: "preview"

      - name: Restore
        run: dotnet restore Lite.Union.slnx

      - name: Build
        run: dotnet build Lite.Union.slnx -c Release --no-restore

      - name: Test (runtime tests, every target framework)
        run: dotnet test tests/Lite.Union.Test/Lite.Union.Test.csproj -c Release --no-build --verbosity normal

      - name: Test (generator tests)
        run: dotnet test tests/Lite.Union.GeneratorTest/Lite.Union.GeneratorTest.csproj -c Release --no-build --verbosity normal

  pack:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # NuGet Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag is on release branch
        id: check-release
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "${{ github.ref }}")
          git fetch origin ${{ env.RELEASE_BRANCH }} 2>/dev/null || true
          if git merge-base --is-ancestor "$TAG_COMMIT" origin/${{ env.RELEASE_BRANCH }} 2>/dev/null; then
            echo "on_release=true" >> $GITHUB_OUTPUT
          else
            echo "on_release=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ github.ref }} is not on branch ${{ env.RELEASE_BRANCH }}. NuGet push will be skipped (artifacts still built)."
          fi

      # The package is built with a stable SDK: the generator targets netstandard2.0 and needs nothing newer.
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Pack
        run: |
          dotnet pack sources/Lite.Union/Lite.Union.csproj -c Release -o out \
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Check package contents
        run: |
          unzip -l out/*.nupkg
          unzip -l out/*.nupkg | grep -q "analyzers/dotnet/cs/Lite.Union.dll"
          unzip -l out/*.nupkg | grep -q "README.md"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: out/*.nupkg

      # Trusted Publishing: the GitHub OIDC token is exchanged for a one-hour nuget.org API key.
      # Needs a trusted publishing policy on nuget.org and the NUGET_USER secret (nuget.org profile name).
      - name: NuGet login (OIDC -> short-lived API key)
        if: steps.check-release.outputs.on_release == 'true'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        if: steps.check-release.outputs.on_release == 'true'
        run: |
          for f in out/*.nupkg; do
            dotnet nuget push "$f" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
